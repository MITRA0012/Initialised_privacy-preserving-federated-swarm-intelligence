<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uploaded files · DocRAG</title>
<style>
:root{color-scheme:dark;--bg:#0b0c0f;--surface:#13151a;--card:#1a1d25;--border:#262932;--accent:#5eff8a;--danger:#ff5e8a;--text:#e8eaf0;--muted:#8c93a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif;min-height:100vh;padding:36px 20px}.wrap{width:min(900px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:20px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--accent)}a{color:var(--accent);text-decoration:none}.nav{display:flex;gap:20px;font-size:14px}h1{font-size:28px;margin:0 0 8px}.hint{color:var(--muted);margin:0 0 24px}.list{display:grid;gap:12px}.row{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}.badge{width:44px;height:44px;border-radius:10px;background:var(--card);display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:12px}.info{min-width:0;flex:1}.name{font-weight:650;overflow-wrap:anywhere}.meta{font-size:13px;color:var(--muted);margin-top:5px}.download{font-size:13px;margin-right:8px;white-space:nowrap}.retry{border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--accent);padding:8px 10px;cursor:pointer;white-space:nowrap}.retry:disabled{opacity:.5;cursor:wait}.remove{width:36px;height:36px;border:1px solid #55313d;border-radius:9px;background:#24161c;color:var(--danger);font-size:22px;line-height:1;cursor:pointer}.remove:hover{background:#3a1d28}.empty,.status{color:var(--muted);padding:26px;background:var(--surface);border:1px solid var(--border);border-radius:12px}.error{color:var(--danger)}@media(max-width:600px){body{padding:22px 14px}.top{align-items:flex-start}.nav{flex-direction:column;gap:8px}.row{gap:10px;padding:12px}.download{font-size:12px}}
</style>
</head>
<body><main class="wrap">
  <header class="top"><div class="brand">Doc<span>RAG</span></div><nav class="nav"><a href="/">Search</a><a href="/upload.html">Upload files</a></nav></header>
  <h1>Uploaded files</h1>
  <p class="hint">Files are kept in the local database until you remove them here.</p>
  <div id="status" class="status">Loading saved files…</div>
  <section id="list" class="list" aria-live="polite"></section>
</main>
<script>
const list=document.getElementById('list'),status=document.getElementById('status');
function formatSize(size){if(size<1024)return `${size} B`;if(size<1048576)return `${(size/1024).toFixed(1)} KB`;return `${(size/1048576).toFixed(1)} MB`}
async function loadFiles(){try{const response=await fetch('/documents');if(!response.ok)throw new Error('Could not load saved files');const files=await response.json();status.hidden=files.length>0;if(!files.length){status.textContent='No files yet. Upload a PDF or DOCX file to get started.';status.hidden=false;return}list.replaceChildren(...files.map(file=>{const row=document.createElement('article');row.className='row';const badge=document.createElement('div');badge.className='badge';badge.textContent=file.type;const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.textContent=file.filename;const meta=document.createElement('div');meta.className='meta';meta.textContent=`${formatSize(file.file_size||0)} · ${file.chunks||0} indexed chunks · ${file.index_status==='indexed'?'Ready to search':'Saved; not indexed'}`;info.append(name,meta);if(file.index_error){const note=document.createElement('div');note.className='meta error';note.textContent=file.index_error;info.append(note)}const download=document.createElement('a');download.className='download';download.href=`/documents/${encodeURIComponent(file.id)}/download`;download.textContent='Download';download.setAttribute('download','');const retry=document.createElement('button');retry.className='retry';retry.type='button';retry.textContent='Retry indexing';retry.hidden=file.index_status==='indexed';retry.addEventListener('click',()=>retryIndex(file.id,retry));const remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.title=`Remove ${file.filename}`;remove.setAttribute('aria-label',`Remove ${file.filename}`);remove.addEventListener('click',()=>removeFile(file.id,file.filename));row.append(badge,info,download,retry,remove);return row}))}catch(error){status.textContent=error.message;status.classList.add('error')}}
async function retryIndex(id,button){button.disabled=true;button.textContent='Indexing?';try{const response=await fetch(`/documents/${encodeURIComponent(id)}/index`,{method:'POST'});const result=await response.json();if(!response.ok)throw new Error(result.detail||'Indexing failed');await loadFiles()}catch(error){status.textContent=error.message;status.classList.add('error');status.hidden=false;button.disabled=false;button.textContent='Retry indexing'}}
async function removeFile(id,name){if(!window.confirm(`Remove “${name}” from your saved files? This also removes its search index.`))return;try{const response=await fetch(`/documents/${encodeURIComponent(id)}`,{method:'DELETE'});const result=await response.json();if(!response.ok)throw new Error(result.detail||'Remove failed');await loadFiles()}catch(error){status.textContent=error.message;status.classList.add('error');status.hidden=false}}
loadFiles();
</script>
</body></html>
